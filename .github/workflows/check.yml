name: check

on:
  pull_request:
  push:
    branches: [develop, master]

# Read-only by default. Without this block GITHUB_TOKEN inherits the repository or
# organization default, which may be read-write; nothing in this repo's CI needs to
# write. A future job that does need write declares it for itself.
permissions:
  contents: read

jobs:
  index:
    # An explicit name decouples the reported check name from the job id. Without it
    # GitHub names the check after the id, so renaming the job later silently breaks
    # every PR into a release branch that requires the old name, until branch
    # protection is re-applied. Set before this repo's first PR, while it was free.
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Part C index matches clients/
        run: ./scripts/check-index.sh
      # A step in this job, never a job of its own: a new job reports a new check
      # name, which master's required check (`check`) would not cover.
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # The action's default lints the root only; clients/ must be covered too.
          globs: '**/*.md'
